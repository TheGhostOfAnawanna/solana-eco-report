<!doctype html><html><head><meta charset="utf-8"><title>Solana Ecosystem Dashboard</title>
<style>body{font-family:system-ui;background:#0b1120;color:#e2e8f0;margin:2rem}h1{color:#9945FF}table{border-collapse:collapse;margin:1rem 0}td,th{padding:.4rem .8rem;border-bottom:1px solid #334155;text-align:left}.num{font-variant-numeric:tabular-nums}#meta{color:#94a3b8}</style></head>
<body><h1>Solana Ecosystem Dashboard</h1><p id="meta">Querying live…</p><div id="out">Loading…</div>
<script>
// LIVE client-side: auto-updates on every page load. Sources: api.llama.fi + api.coingecko.com (free, CORS-enabled, no keys).
const fmt=n=>'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const j=u=>fetch(u,{headers:{accept:'application/json'}}).then(r=>r.json());
const rpc=(m,p)=>fetch('https://api.mainnet-beta.solana.com',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p||[]})}).then(r=>r.json()).then(x=>x.result);
Promise.all([
  j('https://api.llama.fi/v2/chains'),
  j('https://api.llama.fi/protocols'),
  j('https://api.coingecko.com/api/v3/coins/markets?ids=solana&vs_currency=usd&price_change_percentage=24h,7d'),
  rpc('getEpochInfo'),
  rpc('getRecentPerformanceSamples',[8])
]).then(([chains,protos,cg,epoch,samples])=>{
  document.getElementById('meta').textContent='Live · '+new Date().toUTCString()+' · sources: DeFiLlama + CoinGecko';
  const sol=cg[0];
  const top=chains.filter(c=>c.tvl>0).sort((a,b)=>b.tvl-a.tvl);
  const solRank=top.findIndex(c=>c.name==='Solana')+1;
  const solTvl=top.find(c=>c.name==='Solana')?.tvl??0;
  const perChain=p=>{const v=(p.chainTvls||{}).Solana;return typeof v==='number'?v:0};
  const sp=protos.filter(p=>(p.chains||[]).includes('Solana')&&p.category!=='CEX'&&perChain(p)>0)
                  .sort((a,b)=>perChain(b)-perChain(a)).slice(0,15);
  let h=`<p class="num">SOL <b>${fmt(sol.current_price)}</b> · mcap ${fmt(sol.market_cap)} (#${sol.market_cap_rank}) · chain TVL <b>${fmt(solTvl)}</b> (rank #${solRank} of ${top.length} chains)</p>`;
  h+='<table><tr><th colspan=3>Top 10 chains by TVL</th></tr>';
  top.slice(0,10).forEach((c,i)=>{h+=`<tr><td>${i+1}</td><td>${c.name}</td><td class=num>${fmt(c.tvl)}</td></tr>`});
  h+='</table><table><tr><th colspan=4>Top protocols on Solana (per-chain TVL)</th></tr>';
  sp.forEach((p,i)=>{h+=`<tr><td>${i+1}</td><td>${p.name}</td><td>${p.category??''}</td><td class=num>${fmt(perChain(p))}</td></tr>`});
  h+='</table>';
  const secs=samples.reduce((a,s)=>a+s.samplePeriodSecs,0);
  const tps=Math.round(samples.reduce((a,s)=>a+s.numTransactions,0)/secs);
  const nvtps=Math.round(samples.reduce((a,s)=>a+s.numNonVoteTransactions,0)/secs);
  const epPct=(100*epoch.slotIndex/epoch.slotsInEpoch).toFixed(2);
  h+=`<p class=num>Epoch <b>${epoch.epoch}</b> (${epPct}% complete) · <b>${tps.toLocaleString()}</b> tx/s total · ${nvtps.toLocaleString()} tx/s non-vote · ${(epoch.transactionCount/1e9).toFixed(1)}B lifetime txns</p>`;
  document.getElementById('out').innerHTML=h;
}).catch(e=>document.getElementById('out').textContent='Error: '+e);
</script></body></html>
